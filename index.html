<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Pet - Your Virtual Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .auth-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .pet-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .pet-display {
            font-size: 8em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .pet-stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .pet-stat {
            flex: 1;
            max-width: 150px;
        }

        .pet-stat-label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #666;
        }

        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .tasks-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            color: #333;
        }

        .task-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-left: 10px;
        }

        .priority-high {
            background: #fed7d7;
            color: #c53030;
        }

        .priority-medium {
            background: #feebc8;
            color: #c05621;
        }

        .priority-low {
            background: #c6f6d5;
            color: #22543d;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #f56565;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐉 Productivity Pet</h1>
            <p>Your virtual companion for productivity!</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div class="auth-tabs">
                <button class="tab-button active" onclick="switchTab('login')">Login</button>
                <button class="tab-button" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Tab -->
            <div id="loginTab" class="tab-content active">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>

            <!-- Register Tab -->
            <div id="registerTab" class="tab-content">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Choose a password">
                </div>
                <div class="form-group">
                    <label>Pet Name</label>
                    <input type="text" id="regPetName" placeholder="Name your pet">
                </div>
                <button class="btn btn-primary" onclick="register()">Create Account</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard">
            <button class="logout-btn" onclick="logout()">Logout</button>

            <!-- User Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Level</h3>
                    <div class="stat-value" id="userLevel">1</div>
                </div>
                <div class="stat-card">
                    <h3>Total XP</h3>
                    <div class="stat-value" id="userXP">0</div>
                </div>
                <div class="stat-card">
                    <h3>Current Streak</h3>
                    <div class="stat-value" id="userStreak">0</div>
                </div>
                <div class="stat-card">
                    <h3>Tasks Completed</h3>
                    <div class="stat-value" id="tasksCompleted">0</div>
                </div>
            </div>

            <!-- Pet Display -->
            <div class="pet-container">
                <h2 id="petName">Loading...</h2>
                <div class="pet-display" id="petEmoji">🥚</div>
                <p id="petStage">Stage: Egg</p>
                <p id="petMood">Mood: 😊</p>

                <div class="pet-stats">
                    <div class="pet-stat">
                        <div class="pet-stat-label">Health</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="healthBar">100%</div>
                        </div>
                    </div>
                    <div class="pet-stat">
                        <div class="pet-stat-label">Happiness</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="happinessBar">100%</div>
                        </div>
                    </div>
                    <div class="pet-stat">
                        <div class="pet-stat-label">Hunger</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="hungerBar">50%</div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-success" onclick="feedPet()" style="margin-top: 20px; width: auto; padding: 12px 30px;">
                    🍖 Feed Pet (5 XP)
                </button>
            </div>

            <!-- Tasks Section -->
            <div class="tasks-section">
                <h2>📝 Your Tasks</h2>
                <div class="task-input-group">
                    <input type="text" id="taskTitle" class="task-input" placeholder="Task title...">
                    <select id="taskPriority" class="task-input" style="flex: 0 0 150px;">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <button class="btn btn-primary" onclick="createTask()" style="flex: 0 0 150px;">Add Task</button>
                </div>
                <ul id="taskList" class="task-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';
        let authToken = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-button:first-child').classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelector('.tab-button:last-child').classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }

        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const petName = document.getElementById('regPetName').value;

            if (!username || !email || !password || !petName) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        email: email, 
                        password: password, 
                        pet_name: petName 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.access_token;
                    console.log('Registration successful, token:', authToken);
                    showAlert('Registration successful! Welcome!', 'success');
                    showDashboard();
                } else {
                    showAlert(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Connection error. Make sure the server is running!', 'error');
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showAlert('Please enter username and password', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.access_token;
                    console.log('Login successful, token:', authToken);
                    showAlert('Login successful!', 'success');
                    showDashboard();
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Connection error. Make sure the server is running!', 'error');
            }
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').classList.add('active');
            
            setTimeout(() => {
                loadUserData();
                loadPetData();
                loadTasks();
            }, 100);
        }

        async function loadUserData() {
            if (!authToken) {
                console.error('No auth token available');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/profile`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load user data');
                }

                const data = await response.json();
                document.getElementById('userLevel').textContent = data.user.level;
                document.getElementById('userXP').textContent = data.user.total_xp;
                document.getElementById('userStreak').textContent = data.user.current_streak;
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        async function loadPetData() {
            if (!authToken) {
                console.error('No auth token available');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/pet/`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load pet data');
                }

                const data = await response.json();
                const pet = data.pet;
                
                document.getElementById('petName').textContent = pet.pet_name;
                document.getElementById('petStage').textContent = `Stage: ${pet.stage_name}`;
                document.getElementById('petMood').textContent = `Mood: ${pet.mood_emoji}`;
                
                const emojis = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐉', 5: '👑' };
                document.getElementById('petEmoji').textContent = emojis[pet.evolution_stage] || '🥚';
                
                updateProgressBar('healthBar', pet.health);
                updateProgressBar('happinessBar', pet.happiness);
                updateProgressBar('hungerBar', pet.hunger);
            } catch (error) {
                console.error('Error loading pet data:', error);
            }
        }

        function updateProgressBar(barId, value) {
            const bar = document.getElementById(barId);
            bar.style.width = `${value}%`;
            bar.textContent = `${value}%`;
        }

        async function loadTasks() {
            if (!authToken) {
                console.error('No auth token available');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/tasks/`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load tasks');
                }

                const data = await response.json();
                const taskList = document.getElementById('taskList');
                taskList.innerHTML = '';

                const completedCount = data.tasks.filter(t => t.status === 'Completed').length;
                document.getElementById('tasksCompleted').textContent = completedCount;

                data.tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    const isCompleted = task.status === 'Completed';
                    li.innerHTML = `
                        <input type="checkbox" class="task-checkbox" 
                               ${isCompleted ? 'checked disabled' : ''} 
                               onchange="completeTask(${task.task_id})">
                        <div class="task-content">
                            <span class="task-title">${task.title}</span>
                            <span class="task-priority priority-${task.priority.toLowerCase()}">${task.priority}</span>
                        </div>
                        <button class="btn btn-danger" onclick="deleteTask(${task.task_id})" 
                                style="width: auto; padding: 8px 15px;">Delete</button>
                    `;
                    taskList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        async function createTask() {
            const title = document.getElementById('taskTitle').value;
            const priority = document.getElementById('taskPriority').value;

            if (!title) {
                showAlert('Please enter a task title', 'error');
                return;
            }

            if (!authToken) {
                showAlert('Please login first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/tasks/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ 
                        title: title, 
                        priority: priority 
                    })
                });

                if (response.ok) {
                    showAlert('Task created!', 'success');
                    document.getElementById('taskTitle').value = '';
                    loadTasks();
                } else {
                    const data = await response.json();
                    showAlert(data.error || 'Failed to create task', 'error');
                }
            } catch (error) {
                console.error('Error creating task:', error);
                showAlert('Error creating task', 'error');
            }
        }

        async function completeTask(taskId) {
            if (!authToken) {
                showAlert('Please login first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/tasks/${taskId}/complete`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(`🎉 Task completed! +${data.xp_earned} XP`, 'success');
                    loadUserData();
                    loadPetData();
                    loadTasks();
                } else {
                    showAlert(data.error || 'Failed to complete task', 'error');
                }
            } catch (error) {
                console.error('Error completing task:', error);
                showAlert('Error completing task', 'error');
            }
        }

        async function deleteTask(taskId) {
            if (!authToken) {
                showAlert('Please login first', 'error');
                return;
            }

            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showAlert('Task deleted', 'success');
                    loadTasks();
                } else {
                    showAlert('Failed to delete task', 'error');
                }
            } catch (error) {
                console.error('Error deleting task:', error);
                showAlert('Error deleting task', 'error');
            }
        }

        async function feedPet() {
            if (!authToken) {
                showAlert('Please login first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/pet/feed`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, 'success');
                    loadUserData();
                    loadPetData();
                } else {
                    showAlert(data.error || 'Cannot feed pet', 'error');
                }
            } catch (error) {
                console.error('Error feeding pet:', error);
                showAlert('Error feeding pet', 'error');
            }
        }

        function logout() {
            authToken = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboardSection').classList.remove('active');
            showAlert('Logged out successfully', 'success');
        }

        // Check browser console for debugging
        console.log('Productivity Pet loaded. API URL:', API_URL);
    </script>
</body>
</html>
